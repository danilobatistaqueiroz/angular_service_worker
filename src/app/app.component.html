<h1>Version V16 is runnning ...</h1>

<button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" (click)="refreshTimer()">
  Refresh Timer
</button>

<input class="shadow appearance-none border rounded py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" 
    id="username" 
    type="text" 
    placeholder="Username" [(ngModel)]="timer">

<div>
  <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded" routerLink="/login">Login</button>
  <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded" routerLink="/admin">Admin</button>
  <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded" routerLink="/dashboard">Dashboard</button>
  <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded" routerLink="/contact">Contact</button>
</div>

<div *ngIf="logUpdateService.isNewVersionAvailable">
  <button type="button" class="bg-red-500 text-white font-bold rounded" aria-label="Refresh" (click)="logUpdateService.applyUpdate()">
      Update the current version
  </button>
</div>

<button type="button" class="bg-yellow-500 text-white font-bold rounded btchecker" aria-label="Refresh" (click)="toggleCheckForUpdate()">
  {{ !logUpdateService.intervalSubscription ? 'Check for Updates' : 'Stop checking updates'}}
</button>
<router-outlet />
